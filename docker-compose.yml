services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3100"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3100}
      API_URL: ${API_URL:-http://localhost:3001/}
      WS_URL: ${WS_URL:-ws://localhost:3001/ws}
      WS_INTERNAL_URL: http://ws:3001
      SESSION_SECRET: ${SESSION_SECRET:-change-this-to-a-long-random-string}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/splendor}
    depends_on:
      - ws
    ports:
      - "3100:3100"

  ws:
    build:
      context: .
      target: ws
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WS_PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET:-change-this-to-a-long-random-string}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/splendor}
    depends_on:
      - mongo
    ports:
      - "3001:3001"

volumes:
  mongo-data:
